# Calibration for one camera/monochromator pairing.
#
# The constants below are fit for this triple: this camera, this monochromator, this grating.
# Move any of the three and they must be refit -- the grating keys still resolve, `calibrated`
# stays true, and you get a wrong wavelength axis with no error. The `camera` and
# `monochromator` fields are checked against the devices actually loaded, so a mismatch is
# reported at startup.
#
# WARNING gratings 1 and 2 are not calibrated for this camera: both carry the single
# pre-multi-grating fit as a placeholder. Only grating 3 has its own fit.
#
# calibrationThirdOrder/Slope/Offset are carried over from the previous config and are not
# read by any code today.
