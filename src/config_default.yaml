devices:
  cryostat:
    enabled: false
    driver: drivers.Cryocore.Cryocore # Options: .CryoPasqal (Pascal cryostat)
    fallback: drivers.CryoDemo.CryoDemo
  # Spectrometers come in two shapes.
  #
  # 1. Complete instruments, which carry their own wavelength axis: ThorlabsCCS200,
  #    OceanSpectrometer, Heliotis, and the older Pixis/Alize drivers that drive their own
  #    monochromator over serial. They go here directly, as below.
  #
  # 2. A camera on a monochromator, paired by drivers.Spectrograph. The camera driver is a pure
  #    detector, the monochromator is reusable across tables, and the optical calibration -- which
  #    belongs to the (camera, monochromator, grating) triple rather than to any one of them --
  #    lives in its own file under src/calibrations/. See the commented example below.
  spectrometer:
    enabled: true
    driver: drivers.ThorlabsCCS200.ThorlabsCCS200 # Options: .Heliotis, .Pixis, .OceanSpectrometer
    fallback: drivers.SpectrometerDemo_advanced.SpectrometerDemo
    init_args:
      port: 'COM10'
  #
  # Camera on a monochromator -- replace the spectrometer block above with:
  #
  # spectrometer:
  #   enabled: true
  #   driver: drivers.Spectrograph.Spectrograph
  #   fallback: drivers.SpectrometerDemo_advanced.SpectrometerDemo
  #   init_args:
  #     camera:                                    # Options: .StresingCamera.StresingCamera
  #       driver: drivers.PixisCamera.PixisCamera
  #       init_args:
  #         hardware_params:
  #           sensor_height: 256
  #           roi_y0: 138
  #           roi_height: 54
  #     monochromator:
  #       driver: drivers.SpectraPro2300i.SpectraPro2300i
  #       fallback: drivers.SpectraPro2300iDemo.SpectraPro2300iDemo
  #       init_args:
  #         port: COM5
  #     calibration: calibrations/pixis_sp2300i.yaml   # or stresing_sp2300i.yaml
  orpheus:
    enabled: false
    driver: drivers.orpheus.Orpheus
  powermeter:
    enabled: false
    driver: drivers.powermeter.ThorlabsPM100D
    fallback: drivers.powermeter.ThorlabsPM100DDemo
  arduino:
    enabled: false
    driver: drivers.arduino.Arduino
    fallback: drivers.arduino.ArduinoDemo
    init_args:
      port: COM14
  piezos:
    enabled: false
    driver: drivers.piezos.Piezos
    init_args:
      port: COM9
  lakeshore:
    enabled: false
    driver: drivers.lakeshore.Lakeshore
comment: 'User: DT

  Sample:

  Power:

  Wavelength:

  Freq: '
